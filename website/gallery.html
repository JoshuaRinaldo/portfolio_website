<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Joshua Rinaldo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme-toggle.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-link">Home</a>
            <a href="explanations.html" class="nav-link">Model Explanations</a>
            <a href="counterfactuals.html" class="nav-link">Text Counterfactuals</a>
            <a href="gallery.html" class="nav-link active">Gallery</a>
        </div>
    </nav>

    <main class="gallery-page">
        <header class="page-header">
            <h1 class="page-title">Photo Gallery</h1>
            <p class="page-description">A collection of photos</p>
        </header>

        <div class="search-controls">
            <div class="search-group">
                <h3 class="search-title">Search by Color</h3>
                <input type="color" id="color-picker" value="#ffffff">
            </div>

            <div class="search-group">
                <h3 class="search-title">Search by Label</h3>
                <div class="multiselect-wrapper">
                    <div class="multiselect-dropdown" id="label-dropdown">
                        <div class="multiselect-display" id="label-display">
                            <span class="placeholder">Select labels...</span>
                        </div>
                        <div class="multiselect-options" id="label-options">
                        </div>
                    </div>
                </div>
            </div>

            <div class="search-group search-buttons">
                <button id="search-btn" class="search-btn">Search</button>
                <button id="reset-btn" class="reset-btn">Reset</button>
            </div>
        </div>

        <div class="gallery-container">
            <div id="loading" class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading photos...</p>
            </div>

            <div id="photo-grid" class="photo-grid"></div>

            <div id="load-more-trigger" class="load-more-trigger"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
